name: first_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: 3.15.2
  firebase_database: ^11.3.4
  firebase_auth: ^5.5.2
  shared_preferences: ^2.3.2

  # Charts for vitals history
  fl_chart: ^0.69.0

  # Local notifications for alerts
  flutter_local_notifications: ^18.0.1

  # Time formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/